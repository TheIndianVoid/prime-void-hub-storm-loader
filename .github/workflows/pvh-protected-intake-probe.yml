name: PVH Protected VM Intake Probe
on:
  push:
    paths:
      - '.github/workflows/pvh-protected-intake-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm protected archives can be fetched
        shell: bash
        run: |
          set -euo pipefail
          for n in 07 08; do
            echo "Checking protected lot ${n}"
            curl --fail --show-error --location --retry 2 --connect-timeout 15 --max-time 90 "https://sb-6l8h5rw9n5w6.vercel.run/lote${n}-protected.zip" -o "/tmp/lote${n}.zip"
            unzip -t "/tmp/lote${n}.zip" | tail -1
            echo "VM-count $(unzip -Z1 "/tmp/lote${n}.zip" | grep -c '\.lua$')"
          done
