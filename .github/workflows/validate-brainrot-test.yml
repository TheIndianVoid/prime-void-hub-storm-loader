name: Validate Steal a Brainrot port (TEST)

on:
  push:
    branches:
      - feature/steal-brainrot-port-20261110
    paths:
      - "StealBrainrot_TEST.lua"
      - "PVH_BrainrotUI.lua"
      - "PVH_BrainrotESP.lua"
      - "Loader_Brainrot_TEST.lua"
      - ".github/workflows/validate-brainrot-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Luau compiler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -qq /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
      - name: Compile all four source files
        run: |
          set -euo pipefail
          for f in StealBrainrot_TEST.lua PVH_BrainrotUI.lua PVH_BrainrotESP.lua Loader_Brainrot_TEST.lua; do
            echo "Compiling $f"
            /tmp/luau/luau-compile --binary "$f" > /dev/null
          done
      - name: Audit UI coverage, source markers and third-party outbound endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path("StealBrainrot_TEST.lua").read_text()
          adapter=Path("PVH_BrainrotUI.lua").read_text()
          assert "Prime Void Hub | Steal a Brainrot" in raw
          assert "PANEL_KEY" not in raw and "discord.com/api/webhooks" not in raw
          assert "panel-production" not in raw and "megafartCc" not in raw
          assert "local Library,Window=__pvbrCreateUI()" in raw
          for item in ["Auto Grab","Anti Ragdoll","Brainrot ESP","Silent Aim",
                       "Sentry Destroyer","Fake Lag","Low Poly",
                       "Brainrot Purchase","Traps ESP","Server Hop"]:
              assert item in raw or item in adapter, item
          control_count=len(re.findall(r":Add(?:Toggle|Dropdown|Slider|Button|MultiDropdown|SliderToggle)\s*\(",raw))
          print("Controls in gameplay source:",control_count)
          assert control_count>=50
          for section in ["Farm","Combat","Visuals","Fun","Misc","Settings","About"]:
              assert section in adapter
          assert "Description=" not in adapter
          print("PASS: source clean, controls mapped, no filler descriptions")
          PY