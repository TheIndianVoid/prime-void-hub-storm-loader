name: PVH restore 45 verified protected VM modules (temporary)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pvh-restore-vm-20261116.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and cryptographically verify 45 Obscura VM modules
        env:
          PVH_MANIFEST_URL: "https://se73qwuab99fyp12.public.blob.vercel-storage.com/pvh-temporary-20261116/manifest.json"
          PVH_MANIFEST_SHA: "82a86821e654e141dcbdc7da97e836cec25cdc931edb226c2cd1856a0421f9e9"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, time, urllib.request
          def fetch(url, timeout=50):
              if not url.startswith('https://se73qwuab99fyp12.public.blob.vercel-storage.com/pvh-temporary-20261116/'):
                  raise ValueError('Untrusted blob host or prefix: '+url[:90])
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'PVH-Verified-VM-Import/1.0'})
                      with urllib.request.urlopen(req,timeout=timeout) as resp:
                          return resp.read()
                  except Exception:
                      if attempt==2: raise
                      time.sleep(3*(attempt+1))
          raw=fetch(os.environ['PVH_MANIFEST_URL'])
          actual=hashlib.sha256(raw).hexdigest()
          assert actual==os.environ['PVH_MANIFEST_SHA'],f'Protected manifest SHA mismatch: {actual}'
          doc=json.loads(raw)
          items=doc['protectedVMs']
          assert doc['schema']==1 and len(items)==45,'Manifest missing entries'
          assert len(set(x['slug'] for x in items))==45,'Duplicate slugs'
          audit=json.loads(pathlib.Path('obfuscated/checker-manifest.json').read_text(encoding='utf8'))['ports']
          for i,item in enumerate(items,1):
              slug=item['slug'];assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',slug),slug
              assert item['name']==slug+'.lua'
              expected_metadata=audit[slug.replace('-','_')]['metadata']
              assert expected_metadata['compiledModuleGitBlobSha'],slug+' not in checked-in manifest'
              raw_vm=fetch(item['url'])
              digest=hashlib.sha256(raw_vm).hexdigest()
              assert digest==item['sha256'],f'{slug}: SHA256 mismatch'
              assert len(raw_vm)==item['bytes'] and len(raw_vm)>5000,f'{slug}: size mismatch'
              assert raw_vm[:512].find(b'-- Obscura VM [')>=0,f'{slug}: not an Obscura VM'
              target=pathlib.Path('obfuscated')/item['name']
              assert target.is_file(),f'Unregistered module {target}'
              target.write_bytes(raw_vm)
              print(f'PVH_VM_VERIFIED {i}/45 {slug} {len(raw_vm)} {digest[:12]}')
          print('PVH_VM_IMPORT_CHECKS 45/45 passed')
          PY
      - name: Commit complete Obscura modules to the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obfuscated/
          if git diff --cached --quiet; then
            echo "No VM repairs were staged" >&2
            exit 1
          fi
          git commit -m "fix: restore full 45 compiled Obscura VM modules (SHA256 checked)"
          git push origin HEAD:main
