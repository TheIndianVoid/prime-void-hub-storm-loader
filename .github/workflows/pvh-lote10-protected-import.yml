name: PVH protected Lote 10 import (one-shot)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pvh-lote10-protected-import.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and cryptographically verify fifteen compiled Obscura VMs
        env:
          PVH_URL: https://sb-2lg2cp0uimhi.vercel.run/lote10-protected.zip
          PVH_SHA: 7c5603c78336f29bdb70a7d7b4e48e8ead8a819e7a9d95342622e6aa0d4b29df
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, urllib.request, zipfile, time
          url=os.environ['PVH_URL']
          assert url.startswith('https://sb-2lg2cp0uimhi.vercel.run/')
          data=None
          for attempt in range(4):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PrimeVoid-VM-Intake/10'})
                  with urllib.request.urlopen(req,timeout=60) as reply: data=reply.read()
                  break
              except Exception as e:
                  if attempt==3: raise
                  time.sleep(4*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert sha==os.environ['PVH_SHA'],f'Archive SHA mismatch: {sha}'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert 'build_report.json' in z.namelist()
              meta=json.loads(z.read('build_report.json'))
              assert meta['batch']==10 and meta['total']==15 and len(meta['ports'])==15
              names=set(z.namelist())
              slugs={p['slug'] for p in meta['ports']}
              assert len(slugs)==15 and names=={'build_report.json'}|{s+'.lua' for s in slugs}
              for index,p in enumerate(meta['ports'],1):
                  slug=p['slug']
                  assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',slug)
                  assert p['status']=='PROTECTED_COMPILED' and p['syntaxVerified'] is True and p['runtimeVerified'] is False
                  source=z.read(slug+'.lua')
                  assert len(source)==p['protectedBytes'] and len(source)>5000
                  assert hashlib.sha256(source).hexdigest()==p['protectedSha256']
                  assert source.startswith(b'--!nocheck\n--!nolint\n-- Obscura VM [')
                  assert b'local PVH_OriginalGameplay()' not in source
                  path=pathlib.Path('obfuscated')/(slug+'.lua')
                  assert not path.exists(),f'VM already exists: {path}'
                  path.write_bytes(source)
                  print('PVH_IMPORT_10',index,'/15',slug,len(source))
              print('PVH_LOTE10_VERIFIED',len(slugs),'archive',sha)
          PY
      - name: Commit ONLY the fifteen Obscura VM modules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obfuscated/
          if git diff --cached --quiet; then
              echo "No protected modules staged" >&2; exit 1
          fi
          git commit -m "build(batch-10): import 15 complete SHA256 verified Obscura VMs"
          git push origin HEAD:main
